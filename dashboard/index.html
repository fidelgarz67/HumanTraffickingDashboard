<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trafficking Risk Identifier</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <div class="login-box">
            <h1>Trafficking Risk Identifier</h1>
            <p class="subtitle">Secure Login</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            <p id="loginError" class="error-message"></p>
        </div>
    </div>

    <!-- Dashboard (Hidden by default) -->
    <div id="dashboardContainer" class="dashboard-container" style="display: none;">
        <div class="header">
            <h1>Trafficking Risk Identifier</h1>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>

        <div class="content">
            <div class="left-panel">
                <div class="search-section">
                    <h2>Select Region</h2>
                    <select id="regionSelect" class="region-input">
                        <option value="">Select a region</option>
                    </select>
                    <small class="hint">Choose from available regions (country codes from the results file).</small>
                    <button id="searchBtn" class="btn-search" disabled>Show</button>
                </div>

                <div class="features-section">
                    <h2>High-Risk Features</h2>
                    <div id="regionInfo" class="region-info" style="display: none;"></div>
                    <div id="featuresList" class="features-list">
                        <!-- Features will be populated after a search -->
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="map-container">
                    <div id="mapPlaceholder" class="map-placeholder">
                        <p>Map will appear here</p>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <!-- Optional: include AWS SDK if you plan to load from S3 in-browser -->
    <!-- <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1491.0.min.js"></script> -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
