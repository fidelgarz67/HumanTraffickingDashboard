<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trafficking Risk Identifier</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Dashboard -->
    <div id="dashboardContainer" class="dashboard-container" style="display: flex;">
        <div class="header">
            <h1>Trafficking Risk Identifier</h1>
            <div class="header-controls">
                <div class="export-dropdown">
                    <button id="exportBtn" class="btn-export">Export ▾</button>
                    <div id="exportMenu" class="export-menu" style="display:none;">
                        <button class="export-item" data-action="current" data-format="csv" aria-disabled="true">Export Current (CSV)</button>
                        <button class="export-item" data-action="current" data-format="json" aria-disabled="true">Export Current (JSON)</button>
                        <div class="export-sep"></div>
                        <button class="export-item" data-action="all" data-format="csv">Export All (CSV)</button>
                        <button class="export-item" data-action="all" data-format="json">Export All (JSON)</button>
                    </div>
                </div>
            </div>
        </div>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html" aria-current="page">Dashboard</a>
            <a href="methodology.html">Methodology</a>
            <a href="guide.html">Dashboard Guide</a>
            <a href="about.html">About</a>
        </nav>

        <div class="content">
            <div class="left-panel">
                <div class="search-section">
                    <h2>Select Region</h2>
                    <select id="regionSelect" class="region-input">
                        <option value="">Select a region</option>
                    </select>
                    <small class="hint">Choose from available regions (country codes from the results file).</small>
                    <button id="searchBtn" class="btn-search" disabled>Show</button>
                </div>

                <div class="features-section">
                    <h2>High-Risk Features</h2>
                    <div id="regionInfo" class="region-info" style="display: none;"></div>
                    <div id="featuresList" class="features-list">
                        <!-- Features will be populated after a search -->
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="map-container">
                    <div id="mapPlaceholder" class="map-placeholder">
                        <p>Map will appear here</p>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <!-- Optional: include AWS SDK if you plan to load from S3 in-browser -->
    <!-- <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1491.0.min.js"></script> -->

    <!-- Toast notification -->
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
